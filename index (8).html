const WK=['bone','paw','star','bulb','heart','bolt','plus','paw','bone','bulb'];

  let s=Math.imul(c*374761393+r*668265263|0,1274126177);s=(s^(s>>>15))>>>0;s=Math.imul(s,2246822519)>>>0;s=(s^(s>>>13))>>>0;
  const k=WK[s%WK.length],spr=WS[k],sw=spr[0].length,sh=spr.length,
   rot=(k==='bone'||k==='bolt'||k==='plus')?(s>>>16)%4:0,
   ox=c*cell+(r&1?cell>>1:0)+((s>>>8)%9-4)*ps,oy=r*rowH+((s>>>12)%9-4)*ps;
  wg.fillStyle=(s>>>20)%4===0?'rgba(6,18,80,.16)':'rgba(190,214,255,.17)';

   wg.fillRect(ox+q[0]*ps,oy+q[1]*ps,ps,ps)}});
 }
 // чёрный верх (над баннером) и чёрный низ (~2 см), между ними - мрачный еловый лес

 const R=(a,b)=>{let z=Math.imul(a*374761393+b*668265263|0,1274126177);z=(z^(z>>>15))>>>0;z=Math.imul(z,2246822519)>>>0;return((z^(z>>>13))>>>0)/4294967296};

 const spruce=(ox,by,hh,d,s)=>{
  const cl=mix(L[0],L[1],d),cd=mix(Dk[0],Dk[1],d),cs=mix(Sh[0],Sh[1],d),ch=mix(Hi[0],Hi[1],d),

   const ti=(j/th)|0,k=j-ti*th,y=top+j,
    hw=Math.max(1,Math.round(tw*(.42+.58*(ti+1)/tiers)*(.3+.7*(k+1)/th))+(k>=th-2?1:0)+Math.floor(R(s+ti*7,j)*2));
   for(let x=-hw;x<=hw;x++){
    const n=R(ox+x,y+s*3);

  px(ox,top-1,cd);px(ox,top-2,cs)};

   const dir=R(s+b,1)<.5?-1:1,len=1+((R(s,b+5)*hh*.24*(1-b/hh)+1)|0);

   const my=Math.round(yl*ps),mh=Math.round(hh0*.9*ps),mg=wg.createLinearGradient(0,my-mh,0,my+mh);
