function cutBg(c){const w=c.width,h=c.height,x=c.getContext('2d'),d=x.getImageData(0,0,w,h),p=d.data;
 const wh=i=>p[i+3]>0&&p[i]>225&&p[i+1]>225&&p[i+2]>225;
 const st=[];for(let i=0;i<w;i++){st.push(i,0,i,h-1)}for(let j=0;j<h;j++){st.push(0,j,w-1,j)}
 const seen=new Uint8Array(w*h),q=[];
 for(let k=0;k<st.length;k+=2){const X=st[k],Y=st[k+1];if(wh((Y*w+X)*4)&&!seen[Y*w+X]){seen[Y*w+X]=1;q.push(X,Y)}}
 while(q.length){const Y=q.pop(),X=q.pop();p[(Y*w+X)*4+3]=0;
  for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const a=X+dx,b=Y+dy;if(a<0||b<0||a>=w||b>=h||seen[b*w+a])continue;if(wh((b*w+a)*4)){seen[b*w+a]=1;q.push(a,b)}}}
 x.putImageData(d,0,0)}

// плотность: меняй 4200 (меньше = гуще); скорость: 14 + d*62 px/с (d: 0 дальние ... 1 ближние)
const sn=document.getElementById('sn'),sg=sn.getContext('2d');
let SF=[],snU=2,snD=1,snT=0;
function snSize(){snD=window.devicePixelRatio||1;sn.width=Math.round(innerWidth*snD);sn.height=Math.round(innerHeight*snD);
 snU=Math.max(1,Math.round(cv.getBoundingClientRect().width/W*snD));
 const n=Math.max(1,Math.round(Math.max(90,Math.min(260,innerWidth*innerHeight/4200))*AD.snowD));SF=[];
 for(let i=0;i<n;i++){const r=Math.random(),d=r*r;
  SF.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,d,p:Math.random()*6.28,q:Math.random()*6.28,f:.5+Math.random()*.7,v:(14+d*62)*(.8+Math.random()*.4),a:.32+d*.6})}}
function snow(ts){const dt=Math.min(.05,(ts-snT)/1000||0);snT=ts;const t=ts/1000;
 if(!AD.snow){sg.clearRect(0,0,sn.width,sn.height);requestAnimationFrame(snow);return}
 sg.clearRect(0,0,sn.width,sn.height);
 const w=innerWidth,h=innerHeight,gust=10+Math.sin(t*.23)*8+Math.sin(t*.61+1.3)*5;
 for(const f of SF){
  f.y+=f.v*dt;
  f.x+=(gust*(.35+f.d*.9)+Math.sin(t*f.f+f.p)*(5+f.d*13)+Math.sin(t*f.f*2.3+f.q)*(2+f.d*4))*dt;
  if(f.y>h+8){f.y=-8;f.x=Math.random()*w}
  if(f.x>w+8)f.x-=w+16;else if(f.x<-8)f.x+=w+16;
